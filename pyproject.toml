[project]
name = "infra-3tier-aws"
version = "0.1.0"
description = "3-tier AWS topology validator and Terraform generator (CLI, offline)"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: integration tests (CLI via subprocess, offline)",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
